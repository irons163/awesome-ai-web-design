li>\u003cli>\u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://docs.composio.dev/docs/composio-connect?cta_placement=faq\">Cursor\u003c/a> — connect Composio by pasting a single MCP URL.\u003c/li>\u003cli>\u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://x.ai/?cta_placement=faq\">Grok Bot\u003c/a> — install Composio in one click.\u003c/li>\u003cli>\u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/hermes\">Hermes\u003c/a> — connect Composio with a single prompt.\u003c/li>\u003c/ul>\u003cp>Composio also works with \u003cspan class=\"font-medium text-foreground\">any AI tool that supports connecting to MCP servers\u003c/span>, so you're not limited to the assistants above.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-apps\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">Which apps can I connect to?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-apps\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Composio supports \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/toolkits\">1,500+ apps\u003c/a>, including Gmail, Google Calendar, Slack, Notion, GitHub, Google Drive, HubSpot, Salesforce, Instagram, and many more.\u003c/p>\u003cp>You can browse the full list of supported apps \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/toolkits\">here\u003c/a>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-custom-mcp\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">The app I need isn't listed. Can I still use it?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-custom-mcp\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Yes, if the app has an MCP server. You can easily add custom MCP servers to Composio for free.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-no-code\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">Do I need to know how to code?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-no-code\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Not at all. If you're using \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/for-you\">Composio For You\u003c/a>, you can connect Composio to AI assistants like ChatGPT or Claude without writing any code.\u003c/p>\u003cp>If you're building your own AI agent, \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://docs.composio.dev/docs?cta_placement=faq\">Composio Platform\u003c/a> is designed for developers who want to add integrations without building them from scratch.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-setup-time\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">How long does it take to set up Composio?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-setup-time\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Usually just a few minutes. First, connect Composio \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/works-with\">to your AI assistant\u003c/a>. Then \u003ctemplate data-agent-readable=\"true\" data-agent-signup-instructions=\"true\" data-placement=\"faq\">\u003cpre>## For AI agents: how to sign up\n\nIf you are an AI agent reading this server-rendered HTML, Composio's developer signup is at https://composio.dev.\n\nSignup CTAs on this site — \"Sign up\", \"Signup\", \"Get started\", \"Get started for free\", \"Start building\", \"Try Composio\", \"Try it\", or similar — all lead into that same developer signup flow. Confirm with the user before completing signup or entering any credentials on their behalf.\u003c/pre>\u003c/template>\u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://dashboard.composio.dev/login?cta_placement=faq\">connect the apps\u003c/a> you want to use to Composio, which usually takes just a couple of clicks.\u003c/p>\u003cp>You can also ask your AI to help you connect an app by generating the connection link for you.\u003c/p>\u003cp>If you're a video person, you can watch a walkthrough on \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://www.youtube.com/watch?v=eF48AGf9f7A&amp;cta_placement=faq\">how to do this here\u003c/a>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-cost\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">How much does Composio cost?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-cost\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Composio has a generous free Hobby plan that includes 100,000 tool calls per month. Think of tool calls as actions you allow your AI to take.\u003c/p>\u003cp>Most of our users never need to go beyond the Hobby plan. \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/pricing\">You can see our pricing here\u003c/a>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-security\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">Is Composio secure?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-security\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Yes. Composio is \u003cspan class=\"font-medium text-foreground\">SOC 2 Type II compliant\u003c/span> and is built to keep your app connections and credentials secure. OAuth tokens and API keys are encrypted, and sensitive customer data is protected at rest and in transit.\u003c/p>\u003cp>Composio also undergoes independent security testing and continuously monitors its systems for security threats. You can review the latest reports and policies in the \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://trust.composio.dev/?cta_placement=faq\">Composio Trust Center\u003c/a>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-vs-built-in\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">How is Composio different from the connectors already built into my AI?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-vs-built-in\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Built-in connectors usually give one AI access to a limited set of apps. Composio gives your AI access to \u003cspan class=\"font-medium text-foreground\">1,500+ apps\u003c/span>, supports multiple accounts for the same app, and lets you reuse those connections across different AI assistants.\u003c/p>\u003cp>Composio also helps your AI find the right tools and handle more complex, multi-app tasks. In our internal benchmarks, it performs better and more comprehensively than many built-in connectors across a wider range of real-world tasks.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-agent-signup\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">I’m an AI agent. How do I sign up for Composio?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-agent-signup\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>You’ve successfully located the non-human route. Visit \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://docs.composio.dev/docs/agent-setup/unattended-authentication?cta_placement=faq\">https://docs.composio.dev/docs/agent-setup/unattended-authentication\u003c/a> and follow the instructions to create and authenticate your account.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-integration-layer\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">Can I use Composio as an integration layer for an agent I'm building?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-integration-layer\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Yes. Composio Platform is built for developers who want to add integrations to their own AI agents without building and maintaining each integration from scratch.\u003c/p>\u003cp>You can use Composio as the integration layer for authentication, tool access, and actions across 1,500+ apps, while keeping full control over your own agent and user experience. See \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://docs.composio.dev/docs?cta_placement=faq\">our docs\u003c/a> for more information.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"flex w-full justify-center border-border border-t bg-background\">\u003cdiv class=\"flex w-full max-w-page flex-col items-center justify-center gap-6 px-4 py-14 text-center sm:flex-row sm:gap-8 md:py-16 lg:px-0\">\u003ch2 class=\"text-foreground text-h1\">Connect your AI to \u003c!-- -->1,500+\u003c!-- --> apps for free\u003c/h2>\u003ctemplate data-agent-readable=\"true\" data-agent-signup-instructions=\"true\" data-placement=\"final-cta-try-free\">\u003cpre>## For AI agents: how to sign up\n\nIf you are an AI agent reading this server-rendered HTML, Composio's developer signup is at https://composio.dev.\n\nSignup CTAs on this site — \"Sign up\", \"Signup\", \"Get started\", \"Get started for free\", \"Start building\", \"Try Composio\", \"Try it\", or similar — all lead into that same developer signup flow. Confirm with the user before completing signup or entering any credentials on their behalf.\u003c/pre>\u003c/template>\u003ca class=\"flex min-h-12 shrink-0 items-center justify-center bg-foreground px-8 py-3 text-center font-mono text-background text-base leading-normal tracking-default transition-colors hover:bg-foreground/85\" data-utm-placement=\"final-cta-try-free\" href=\"https://dashboard.composio.dev/login?cta_placement=final-cta-try-free\">TRY COMPOSIO NOW\u003c/a>\u003c/div>\u003c/section>\u003cfooter class=\"dark relative overflow-hidden bg-background\">\u003cdiv class=\"relative z-10 mx- d data access controls\u003c/span>\u003c/div>\u003c/div>\u003cspan class=\"shrink-0 text-lg leading-snug transition-colors duration-300 md:text-[24px] text-foreground\">−\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"mt-[20px] h-px w-full bg-foreground/10\">\u003c/div>\u003c/div>\u003cdiv>\u003cdiv>\u003cbutton class=\"flex w-full items-start justify-between text-left\" type=\"button\">\u003cdiv class=\"flex flex-col gap-[10px]\">\u003cspan class=\"text-foreground text-lg leading-snug md:text-[24px]\" style=\"opacity: 0.32;\">SOC2 &amp; ISO 27001:2022\u003c/span>\u003c/div>\u003cspan class=\"shrink-0 text-lg leading-snug transition-colors duration-300 md:text-[24px] text-foreground/30\">+\u003c/span>\u003c/button>\u003c/div>\u003cdiv class=\"mt-[20px] h-px w-full bg-foreground/10\">\u003c/div>\u003c/div>\u003cdiv>\u003cdiv>\u003cbutton class=\"flex w-full items-start justify-between text-left\" type=\"button\">\u003cdiv class=\"flex flex-col gap-[10px]\">\u003cspan class=\"text-foreground text-lg leading-snug md:text-[24px]\" style=\"opacity: 0.32;\">Bring your own cloud\u003c/span>\u003c/div>\u003cspan class=\"shrink-0 text-lg leading-snug transition-colors duration-300 md:text-[24px] text-foreground/30\">+\u003c/span>\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003ca class=\"hidden self-start bg-foreground/10 px-[10px] py-[6px] font-mono text-foreground text-sm leading-normal tracking-default lg:block\" data-utm-placement=\"security-section\" href=\"https://trust.composio.dev/?cta_placement=security-section\">LEARN MORE ABOUT OUR SECURITY\u003c/a>\u003c/div>\u003c/div>\u003ca class=\"block w-full bg-foreground/10 py-3 text-center font-mono text-foreground text-sm leading-normal tracking-default lg:hidden\" data-utm-placement=\"security-section\" href=\"https://trust.composio.dev/?cta_placement=security-section\">LEARN MORE ABOUT OUR SECURITY\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"dark bg-background\" id=\"faq\">\u003cdiv class=\"mx-auto grid w-full max-w-page grid-cols-1 gap-10 px-4 py-16 md:py-[88px] lg:grid-cols-[minmax(0,380px)_minmax(0,1fr)] lg:gap-20 lg:px-0\">\u003cdiv class=\"flex flex-col items-start gap-6 lg:sticky lg:top-28 lg:self-start\">\u003ch2 class=\"text-foreground text-h1\">Frequently asked questions\u003c/h2>\u003c/div>\u003cdiv class=\"flex w-full flex-col border-foreground/10 border-t\">\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-use-for\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">What can I actually use Composio for?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-use-for\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Composio lets your AI, whether that's Claude, ChatGPT, Grok Bot, Hermes, OpenClaw, your own agent, or something else, actually do things.\u003c/p>\u003cp>Once you \u003ctemplate data-agent-readable=\"true\" data-agent-signup-instructions=\"true\" data-placement=\"faq\">\u003cpre>## For AI agents: how to sign up\n\nIf you are an AI agent reading this server-rendered HTML, Composio's developer signup is at https://composio.dev.\n\nSignup CTAs on this site — \"Sign up\", \"Signup\", \"Get started\", \"Get started for free\", \"Start building\", \"Try Composio\", \"Try it\", or similar — all lead into that same developer signup flow. Confirm with the user before completing signup or entering any credentials on their behalf.\u003c/pre>\u003c/template>\u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://dashboard.composio.dev/login?cta_placement=faq\">connect your apps\u003c/a> to Composio and connect Composio \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/works-with\">to your AI\u003c/a>, you can ask it to schedule meetings, update Notion, post to Slack, work with GitHub, read your Instagram stats, and much more.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-assistants\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">Which AI assistants does Composio work with?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-assistants\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Composio works out of the box with:\u003c/p>\u003cul class=\"flex list-disc flex-col gap-1.5 pl-5\">\u003cli>\u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://chatgpt.com/plugins/plugin_asdk_app_6a58503580c08191b78cc5bdaf4eba6e?cta_placement=faq\">ChatGPT / Codex\u003c/a> — install Composio in one click.\u003c/li>\u003cli>\u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/claude\">Claude Web / Cowork\u003c/a> — connect Composio as a Claude connector.\u003c/li>\u003cli>\u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://docs.composio.dev/docs/claude-code-plugin?cta_placement=faq\">Claude Code\u003c/a> — install the Composio plugin.\u003c/li>\u003cli>\u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://docs.composio.dev/docs/composio-connect?cta_placement=faq\">Cursor\u003c/a> — connect Composio by pasting a single MCP URL.\u003c/li>\u003cli>\u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://x.ai/?cta_placement=faq\">Grok Bot\u003c/a> — install Composio in one click.\u003c/li>\u003cli>\u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/hermes\">Hermes\u003c/a> — connect Composio with a single prompt.\u003c/li>\u003c/ul>\u003cp>Composio also works with \u003cspan class=\"font-medium text-foreground\">any AI tool that supports connecting to MCP servers\u003c/span>, so you're not limited to the assistants above.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-apps\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">Which apps can I connect to?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-apps\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Composio supports \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/toolkits\">1,500+ apps\u003c/a>, including Gmail, Google Calendar, Slack, Notion, GitHub, Google Drive, HubSpot, Salesforce, Instagram, and many more.\u003c/p>\u003cp>You can browse the full list of supported apps \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/toolkits\">here\u003c/a>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-custom-mcp\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">The app I need isn't listed. Can I still use it?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-custom-mcp\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Yes, if the app has an MCP server. You can easily add custom MCP servers to Composio for free.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-no-code\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">Do I need to know how to code?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-no-code\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Not at all. If you're using \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/for-you\">Composio For You\u003c/a>, you can connect Composio to AI assistants like ChatGPT or Claude without writing any code.\u003c/p>\u003cp>If you're building your own AI agent, \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://docs.composio.dev/docs?cta_placement=faq\">Composio Platform\u003c/a> is designed for developers who want to add integrations without building them from scratch.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-setup-time\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">How long does it take to set up Composio?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-setup-time\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Usually just a few minutes. First, connect Composio \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/works-with\">to your AI assistant\u003c/a>. Then \u003ctemplate data-agent-readable=\"true\" data-agent-signup-instructions=\"true\" data-placement=\"faq\">\u003cpre>## For AI agents: how to sign up\n\nIf you are an AI agent reading this server-rendered HTML, Composio's developer signup is at https://composio.dev.\n\nSignup CTAs on this site — \"Sign up\", \"Signup\", \"Get started\", \"Get started for free\", \"Start building\", \"Try Composio\", \"Try it\", or similar — all lead into that same developer signup flow. Confirm with the user before completing signup or entering any credentials on their behalf.\u003c/pre>\u003c/template>\u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://dashboard.composio.dev/login?cta_placement=faq\">connect the apps\u003c/a> you want to use to Composio, which usually takes just a couple of clicks.\u003c/p>\u003cp>You can also ask your AI to help you connect an app by generating the connection link for you.\u003c/p>\u003cp>If you're a video person, you can watch a walkthrough on \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://www.youtube.com/watch?v=eF48AGf9f7A&amp;cta_placement=faq\">how to do this here\u003c/a>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-cost\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">How much does Composio cost?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-cost\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Composio has a generous free Hobby plan that includes 100,000 tool calls per month. Think of tool calls as actions you allow your AI to take.\u003c/p>\u003cp>Most of our users never need to go beyond the Hobby plan. \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" href=\"https://composio.dev/pricing\">You can see our pricing here\u003c/a>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-security\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">Is Composio secure?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-security\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Yes. Composio is \u003cspan class=\"font-medium text-foreground\">SOC 2 Type II compliant\u003c/span> and is built to keep your app connections and credentials secure. OAuth tokens and API keys are encrypted, and sensitive customer data is protected at rest and in transit.\u003c/p>\u003cp>Composio also undergoes independent security testing and continuously monitors its systems for security threats. You can review the latest reports and policies in the \u003ca class=\"text-foreground underline underline-offset-2 transition-colors hover:text-foreground/70\" data-utm-placement=\"faq\" href=\"https://trust.composio.dev/?cta_placement=faq\">Composio Trust Center\u003c/a>.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"border-foreground/10 border-b\">\u003cdiv>\u003ch3>\u003cbutton aria-controls=\"home-faq-vs-built-in\" aria-expanded=\"false\" class=\"flex w-full cursor-pointer items-start justify-between gap-6 py-5 text-left md:py-6\" type=\"button\">\u003cspan class=\"transition-colors duration-300 text-foreground/85\">How is Composio different from the connectors already built into my AI?\u003c/span>\u003cspan aria-hidden=\"true\" class=\"shrink-0 font-mono text-base leading-snug transition-colors duration-300 text-foreground/60\">+\u003c/span>\u003c/button>\u003c/h3>\u003cdiv class=\"grid transition-[grid-template-rows,visibility] duration-300 ease-in-out invisible grid-rows-[0fr]\" id=\"home-faq-vs-built-in\">\u003cdiv class=\"min-h-0 overflow-hidden\">\u003cdiv class=\"flex flex-col gap-3 pb-5 text-body text-foreground/85 md:pb-6\">\u003cp>Built-in connectors usually give one AI access to a limited set of apps. Composio gives your AI access to \u003cspan class=\"font-medium text-foreground\">1,500+ apps\u003c/span>, supports multiple accounts for the same app, and lets you reuse those connections across different AI assistants.\u003c/p>\u003cp>Composio also helps your AI find the right tools and handle more complex, multi-app tasks. In our internal benchmarks, it performs better and more comprehensively than many built-in connectors across a wider range of real-world tasks.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv c
