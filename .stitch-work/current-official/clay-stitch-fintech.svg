<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Fintech 3D tube gradients -->
    <linearGradient id="fintech-neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <radialGradient id="emerald-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="fintech-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#10b981" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="500" fill="transparent" />

  <!-- Ambient light glow -->
  <circle cx="340" cy="250" r="180" fill="url(#emerald-glow)" />

  <!-- Interlocking futuristic tubular rings / Mobius structure -->
  <g filter="url(#fintech-glow)">
    <!-- Back loop -->
    <path d="M 120,320 C 80,180 200,90 340,110 C 470,130 520,240 450,350 C 390,440 260,450 180,380"
          fill="none"
          stroke="#3b0764"
          stroke-width="58"
          stroke-linecap="round" />

    <!-- Main dynamic torus curve -->
    <path d="M 140,300 C 100,190 210,110 330,120 C 460,135 500,230 440,330 C 380,420 270,420 200,360"
          fill="none"
          stroke="url(#fintech-neon-purple)"
          stroke-width="50"
          stroke-linecap="round" />

    <!-- Secondary intertwining emerald neon tube -->
    <path d="M 220,130 C 350,70 470,160 460,280 C 450,400 320,440 210,360 C 120,290 140,170 240,140"
          fill="none"
          stroke="#059669"
          stroke-width="32"
          opacity="0.8"
          stroke-linecap="round" />

    <!-- Iridescent specular highlight ribbon -->
    <path d="M 150,280 C 120,200 210,130 320,135 C 440,140 480,225 430,315"
          fill="none"
          stroke="#ffffff"
          stroke-width="8"
          opacity="0.65"
          stroke-linecap="round" />

    <!-- Dynamic particle nodes -->
    <circle cx="430" cy="180" r="14" fill="#34d399" />
    <circle cx="210" cy="360" r="9" fill="#c084fc" />
    <circle cx="160" cy="220" r="6" fill="#a7f3d0" />
  </g>
</svg>
