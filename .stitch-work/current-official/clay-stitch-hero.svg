<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background glow/shadow -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <filter id="sphere-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Glossy white satellite gradient -->
    <linearGradient id="satellite-body" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f8f9fa" />
      <stop offset="70%" stop-color="#e2e5ea" />
      <stop offset="100%" stop-color="#c5cbd3" />
    </linearGradient>

    <!-- Satellite rim highlight -->
    <linearGradient id="satellite-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a0a8b4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Purple sphere gradient -->
    <radialGradient id="purple-ball" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="30%" stop-color="#9333ea" />
      <stop offset="75%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#3b0764" />
    </radialGradient>

    <!-- Orange sphere gradient -->
    <radialGradient id="orange-ball" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="80%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>

    <!-- Torus ring gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Purple sphere (floating top right of satellite) -->
  <g filter="url(#sphere-shadow)">
    <circle cx="390" cy="110" r="42" fill="url(#purple-ball)" />
    <!-- Specular gleam -->
    <ellipse cx="376" cy="96" rx="14" ry="9" fill="#ffffff" opacity="0.6" transform="rotate(-20 376 96)" />
  </g>

  <!-- Main Floating Satellite / Futuristic Curved Pod -->
  <g filter="url(#soft-shadow)" transform="rotate(-18 300 310)">
    <!-- Base smooth body -->
    <path d="M 170,300 C 170,180 230,130 350,130 C 470,130 520,200 520,310 C 520,430 440,490 320,490 C 200,490 170,410 170,300 Z"
          fill="url(#satellite-body)"
          stroke="url(#satellite-rim)"
          stroke-width="2.5" />

    <!-- Sleek inset aperture/trench -->
    <path d="M 230,310 C 230,230 270,195 355,195 C 435,195 470,240 470,315 C 470,395 420,435 340,435 C 260,435 230,380 230,310 Z"
          fill="#d8dde4" opacity="0.75" />

    <!-- Glossy inner nucleus core -->
    <ellipse cx="350" cy="315" rx="65" ry="75" fill="#f8fafc" />

    <!-- Surface light reflection arc -->
    <path d="M 210,230 C 260,160 380,150 460,190" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <path d="M 225,245 C 265,185 365,175 435,210" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Orange sphere (floating lower left) -->
  <g filter="url(#sphere-shadow)">
    <circle cx="150" cy="410" r="54" fill="url(#orange-ball)" />
    <!-- Specular gleam -->
    <ellipse cx="132" cy="392" rx="18" ry="12" fill="#ffffff" opacity="0.65" transform="rotate(-25 132 392)" />
  </g>

  <!-- Subtle orbiting accent ring fragment -->
  <ellipse cx="320" cy="300" rx="230" ry="140" fill="none" stroke="url(#ring-grad)" stroke-width="2" stroke-dasharray="140 120 60 80" opacity="0.4" transform="rotate(-30 320 300)" />
</svg>
