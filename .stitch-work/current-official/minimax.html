    function updateHeader(){document.querySelectorAll('.official-header-desktop,.official-header-mobile-bar').forEach(e=>{e.classList.toggle('is-scrolled',scrollY>10);e.classList.toggle('is-overlay',scrollY<=10);});document.querySelectorAll('img.official-header-logo[data-study-white]').forEach(e=>e.src=(scrollY>10?e.dataset.studyBlack:e.dataset.studyWhite));}
    function toggleMenu(open){menuOpen=open;const currentBar=document.querySelector('.official-header-mobile-bar');if(currentBar&&closedBar){const t=document.createElement('template');t.innerHTML=open?CONFIG.menuOpen:closedBar;currentBar.replaceWith(t.content);}const input=document.getElementById('burger-menu');if(input)input.checked=open;document.body.style.overflow=open?'hidden':'';updateHeader();}
    document.addEventListener('change',e=>{if(e.target.id==='burger-menu')toggleMenu(e.target.checked);});document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleMenu(false);});addEventListener('scroll',updateHeader,{passive:true});updateHeader();
    const mediaObserver = new IntersectionObserver(entries => entries.forEach(entry => {
      const video = entry.target;
      if (entry.isIntersecting) video.play().catch(() => {}); else video.pause();
    }));
    document.querySelectorAll('video').forEach(v => {v.muted = true; v.loop = true; v.preload = 'auto'; v.load(); mediaObserver.observe(v);});
  }
  document.addEventListener('submit', e => {e.preventDefault(); location.assign(OFFICIAL_URL);});
  media.addEventListener('change', install); install();
})();</script></body></html>
