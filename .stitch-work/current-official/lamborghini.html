.meride-video-container {
    background-color: #000;
    position: relative;
    clear: both;
    font-family: 'Open Sans', sans-serif;
    max-width: 100%;
    word-break: normal;
}

.meride-video-container video {
    max-width: 100%;
    left: 0;
}

.meride-video-container video.clickable-video {
    cursor: pointer;
}

.meride-video-container * {
    transition: none;
    -webkit-transition: none;
}

.meride-video-container::-webkit-media-controls-play-button,
.meride-video-container::-webkit-media-controls-start-playback-button {
    opacity: 0;
    pointer-events: none;
    width: 5px;
}

.meride-video-container .loadingSpinner {
    width: 60px;
    height: 60px;
    background-color: #ffce3e;
    left: 50%;
    top: 50%;
    position: absolute;
    margin-left: -30px;
    margin-top: -30px;
    display: none;
    border-radius: 100%;
    z-index: 12;
    -webkit-animation: sk-scaleout 1.0s infinite ease-in-out;
    animation: sk-scaleout 1.0s infinite ease-in-out;
}

@-webkit-keyframes sk-scaleout {
  0% { -webkit-transform: scale(0) }
  100% {
    -webkit-transform: scale(1.0);
    opacity: 0;
  }
}

@keyframes sk-scaleout {
  0% {
    -webkit-transform: scale(0);
    transform: scale(0);
  } 100% {
    -webkit-transform: scale(1.0);
    transform: scale(1.0);
    opacity: 0;
  }
}

.meride-video-container .btn {
    fill: #fff;
}

.meride-video-container button:focus {
    outline: none;
}

.meride-video-container .controlBarContainer {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 55px;
    width: 100%;
    background-color: transparent;
    background-color: rgba(0, 0, 0, .25);
}

.meride-video-container .controlBar {
    height: 55px;
    width: 96%;
    position: absolute;
    bottom: 0;
    margin-left: 2%;
    background-color: transparent;
    display: table-cell;
    color: #fff;
    z-index: 10;
}

.meride-video-container .controlBar .controlBarBtn:hover g:first-child {
    fill: #f0f0f0;
}

.meride-video-container .md-progressBar {
    height: 8px;
    background-color: rgb(102, 102, 102);
    background-color: rgba(102, 102, 102, 1);
    width: 100%;
    bottom: 0;
    left: 0;
    vertical-align: middle;
    position: relative;
    box-sizing: content-box;
}

.meride-video-container .progressBarTop {
    position: absolute;
    top: 0;
}

.meride-video-container .md-progressBar:hover.disabled {
    cursor: default;
}

.meride-video-container .md-progressBar:hover {
    cursor: pointer;
}

.meride-video-container .md-progressBar .md-spinner {
    height: 8px;
    width: 0;
    background-color: rgb(255, 206, 62);
    background-color: rgba(255, 206, 62, 1);
    position: absolute;
    top: 0;
    left: 0;
}

.meride-video-container .md-progressBar .md-bufferContainer {
    height: 8px;
    width: 0;
    position: absolute;
    top: 0;

    margin: 0;
    background-color: rgb(230, 230, 230);
    background-color: rgba(230, 230, 230, 1);
}

.meride-video-container .controlBarContainer button, .meride-video-container .md-progressBar button {
    border: none;
    background-color: transparent;
    cursor: pointer;
    padding: 2px;
    width: 35px;
    height: 35px;
    margin: 0;
    box-sizing: border-box;
}

.meride-video-container .controlBarContainer .liveBtn {
    width: 80px;
}

.meride-video-container .volumeBarContainer {
    position: absolute;
    left: 50%;
    margin-left: -15px;
    height: 120px;
    bottom: 55px;
    padding-bottom: 2px;
}

.meride-video-container .volumeBarContainer.active {
    visibility: visible;
}

.meride-video-container .volumeBarContainer.inactive {
    visibility: hidden;
}

.meride-video-container .volumeContainer {
    position: relative;
}

.meride-video-container .volumeBarContainer .volumeBarInnerContainer {
    position: relative;
    width: 30px;
    height: 120px;
    background-color: rgb(0, 0, 0);
    background-color: rgba(0, 0, 0, .25);
}


.meride-video-container .volumeBarContainer .volumeBarInnerContainer .volumeBarSpinner {
    position:  absolute;
    width: 4px;
    left: 0;
    bottom: 0;
    background-color: rgb(255, 206, 62);
    background-color: rgba(255, 206, 62, 1);
    min-height: 8px;
    z-index: 11;
}

.meride-video-container .volumeBarContainer .volumeBarInnerContainer .volumeBarLevel {
    position:  absolute;
    width: 4px;
    height: 100px;
    left: 13px;
    top: 10px;
    background-color: #fff;
    z-index: 10;
}


.meride-video-container .volumeBarContainer .volumeBarInnerContainer .volumeHandlerBtn {
    position: absolute;
    left: -6px;
    width: 16px;
    height: 16px;
    border: none;
    background-color: transparent;
    cursor: pointer;
    padding: 0;
    z-index: 13;
    max-width: initial;
}

.meride-video-container .md-progressBar .md-seekBtn {
    width: 46px;
    height: 46px;
    position: absolute;
    margin-left: -23px;
    bottom: -18px;
}

.meride-video-container .toright {
    float: right;
}

    min-width: 1.5em;
    text-align: left;
    line-height: 40px;
    color: #fff;

.meride-video-container .fullBtn {

}

.meride-video-container .reduceBtn {

.meride-video-container .pipExitBtn {

    background-color: rgb(0, 0, 0);

.meride-video-container .settings button {

.meride-video-container .settings .closeSettingBtn {

.meride-video-container .settings .closeSettingBtn .btn {
    fill: #fff;

.meride-video-container .settings .settingsContainer {

.meride-video-container .settings .settingsContainer .settingComponent {

}

.meride-video-container .settings .settingsContainer .settingComponent button {

.meride-video-container .boxcenter {
    left: 50%;
    top: 50%;
    position: absolute;
}

.meride-video-container .boxcenterBtn {
    width: 100px;
    height: 100px;
    border: none;
    background-color: transparent;
    cursor: pointer;
    z-index: 12;
    margin-left: -50px;
    margin-top: -50px;

.meride-video-container .boxcenterBtnSmall {

.meride-video-container .boxcenterBtn:hover circle {

.meride-video-container .topBarBtn {
    height: 40px;

.meride-video-container .topBar {

.meride-video-container .controlBarRight {

.meride-video-container .controlBarCenter {

.meride-video-container .controlBarCell {

.meride-video-container .controlBarCellRight {

.meride-video-container .poster {

.meride-video-container video::cue {

.meride-video-container video::-webkit-media-text-track-container {

.meride-video-container {
    background-color: #000;
    position: relative;
    clear: both;
    font-family: 'Open Sans', sans-serif;
    max-width: 100%;
    word-break: normal;
}

.meride-video-container video {
    max-width: 100%;
    left: 0;
}

.meride-video-container video.clickable-video {
    cursor: pointer;
}

.meride-video-container * {
    transition: none;
    -webkit-transition: none;
}

.meride-video-container::-webkit-media-controls-play-button,
.meride-video-container::-webkit-media-controls-start-playback-button {
    opacity: 0;
    pointer-events: none;
    width: 5px;
}

.meride-video-container .loadingSpinner {
    width: 60px;
    height: 60px;
    background-color: #ffce3e;
    left: 50%;
    top: 50%;
    position: absolute;
    margin-left: -30px;
    margin-top: -30px;
    display: none;
    border-radius: 100%;
    z-index: 12;
    -webkit-animation: sk-scaleout 1.0s infinite ease-in-out;
    animation: sk-scaleout 1.0s infinite ease-in-out;
}

@-webkit-keyframes sk-scaleout {
  0% { -webkit-transform: scale(0) }
  100% {
    -webkit-transform: scale(1.0);
    opacity: 0;
  }
}

@keyframes sk-scaleout {
  0% {
    -webkit-transform: scale(0);
    transform: scale(0);
  } 100% {
    -webkit-transform: scale(1.0);
    transform: scale(1.0);
    opacity: 0;
  }
}

.meride-video-container .btn {
    fill: #fff;
}

.meride-video-container button:focus {
    outline: none;
}

.meride-video-container .controlBarContainer {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 55px;
    width: 100%;
    background-color: transparent;
    background-color: rgba(0, 0, 0, .25);
}

.meride-video-container .controlBar {
    height: 55px;
    width: 96%;
    position: absolute;
    bottom: 0;
    margin-left: 2%;
    background-color: transparent;
    display: table-cell;
    color: #fff;
    z-index: 10;
}

.meride-video-container .controlBar .controlBarBtn:hover g:first-child {
    fill: #f0f0f0;
}

.meride-video-container .md-progressBar {
    height: 8px;
    background-color: rgb(102, 102, 102);
    background-color: rgba(102, 102, 102, 1);
    width: 100%;
    bottom: 0;
    left: 0;
    vertical-align: middle;
    position: relative;
    box-sizing: content-box;
}

.meride-video-container .progressBarTop {
    position: absolute;
    top: 0;
}

.meride-video-container .md-progressBar:hover.disabled {
    cursor: default;
}

.meride-video-container .md-progressBar:hover {
    cursor: pointer;
}

.meride-video-container .md-progressBar .md-spinner {
    height: 8px;
    width: 0;

    top: 0;
    left: 0;

ical in nature must be acquired. “Strictly necessary\ncookies” and “functionality cookies” fall within the category of technical cookies.\nConsent for the types of cookies for which consent prior to installation is required may be revoked at any\ntime by deactivating the cookies following the procedures described hereunder.\nCookies can be authorized, restricted or blocked also through browser settings. However, the device will be\nset in such a way as to refuse the technical or navigation cookies, and some site services might not be\ncorrectly displayed or function optimally. To disable the cookies, follow the cookie management\ninstructions provided on the browser. ​​&nbsp;\nYou can change your preferences and give your consent or selective denial to installing cookies using the\nform shown above at any time.\n            \u003cbr>\u003ca href=\"https://cookiepedia.co.uk/giving-consent-to-cookies\" class=\"privacy-notice-link\" rel=\"noopener\" target=\"_blank\" aria-label=\"More information about your privacy, opens in a new tab\">More information\u003c/a>\u003c/div>\u003cbutton id=\"accept-recommended-btn-handler\">Allow All\u003c/button>\u003csection class=\"ot-sdk-row ot-cat-grp\">\u003ch3 id=\"ot-category-title\"> Manage Consent Preferences\u003c/h3>\u003cdiv class=\"ot-accordion-layout ot-cat-item ot-vs-config\" data-optanongroupid=\"C0001\">\u003cbutton aria-expanded=\"false\" ot-accordion=\"true\" aria-controls=\"ot-desc-id-C0001\" aria-labelledby=\"ot-header-id-C0001\">\u003c/button>\u003c!-- Accordion header -->\u003cdiv class=\"ot-acc-hdr ot-always-active-group\">\u003cdiv class=\"ot-plus-minus\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\u003ch4 class=\"ot-cat-header\" id=\"ot-header-id-C0001\">Strictly Necessary Cookies\u003c/h4>\u003cdiv class=\"ot-always-active\">Always Active\u003c/div>\u003c/div>\u003c!-- accordion detail -->\u003cdiv class=\"ot-acc-grpcntr ot-acc-txt\">\u003cp class=\"ot-acc-grpdesc ot-category-desc\" id=\"ot-desc- ivating the cookies following the procedures described hereunder.\nCookies can be authorized, restricted or blocked also through browser settings. However, the device will be\nset in such a way as to refuse the technical or navigation cookies, and some site services might not be\ncorrectly displayed or function optimally. To disable the cookies, follow the cookie management\ninstructions provided on the browser. ​​&nbsp;\nYou can change your preferences and give your consent or selective denial to installing cookies using the\nform shown above at any time.\n            \u003cbr>\u003ca href=\"https://cookiepedia.co.uk/giving-consent-to-cookies\" class=\"privacy-notice-link\" rel=\"noopener\" target=\"_blank\" aria-label=\"More information about your privacy, opens in a new tab\">More information\u003c/a>\u003c/div>\u003cbutton id=\"accept-recommended-btn-handler\">Allow All\u003c/button>\u003csection class=\"ot-sdk-row ot-cat-grp\">\u003ch3 id=\"ot-category-title\"> Manage Consent Preferences\u003c/h3>\u003cdiv class=\"ot-accordion-layout ot-cat-item ot-vs-config\" data-optanongroupid=\"C0001\">\u003cbutton aria-expanded=\"false\" ot-accordion=\"true\" aria-controls=\"ot-desc-id-C0001\" aria-labelledby=\"ot-header-id-C0001\">\u003c/button>\u003c!-- Accordion header -->\u003cdiv class=\"ot-acc-hdr ot-always-active-group\">\u003cdiv class=\"ot-plus-minus\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\u003ch4 class=\"ot-cat-header\" id=\"ot-header-id-C0001\">Strictly Necessary Cookies\u003c/h4>\u003cdiv class=\"ot-always-active\">Always Active\u003c/div>\u003c/div>\u003c!-- accordion detail -->\u003cdiv class=\"ot-acc-grpcntr ot-acc-txt\">\u003cp class=\"ot-acc-grpdesc ot-category-desc\" id=\"ot-desc-id-C0001\">These cookies are necessary for the website to function and cannot be switched off in our systems. They are usually only set in response to actions made by you which amount to a request for services, such as setting your privacy preferences, logging in or filling in forms. &nbsp; &nbsp;You can set your browser to block or alert you about these cookies, but some parts of the site will not then work. These cookies do not store any personally identifiable information.\u003c/p>\u003cdiv class=\"ot-hlst-cntr\">\u003cbutton class=\"ot-link-btn category-host-list-handler\" aria-label=\"Cookie Details button opens Cookie List menu\" data-parent-id=\"C0001\">Cookies Details‎\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"ot-accordion-layout ot-cat-item ot-vs-config\" data-optanongroupid=\"C0003\">\u003cbutton aria-expanded=\"false\" ot-accordion=\"true\" aria-controls=\"ot-desc-id-C0003\" aria-labelledby=\"ot-header-id-C0003\">\u003c/button>\u003c!-- Accordion header -->\u003cdiv class=\"ot-acc-hdr ot-always-active-group\">\u003cdiv class=\"ot-plus-minus\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\u003ch4 class=\"ot-cat-header\" id=\"ot-header-id-C0003\">Functional Cookies\u003c/h4>\u003cdiv class=\"ot-always-active\">Always Active\u003c/div>\u003c/div>\u003c!-- accordion detail -->\u003cdiv class=\"ot-acc-grpcntr ot-acc-txt\">\u003cp class=\"ot-acc-grpdesc ot-category-desc\" id=\"ot-desc-id-C0003\">These cookies enable the website to provide enhanced functionality and personalisation. They may be set by us or by third party providers whose services we have added to our pages. &nbsp; &nbsp;If you do not allow these cookies then some or all of these services may not function properly.\u003c/p>\u003cdiv class=\"ot-hlst-cntr\">\u003cbutton class=\"ot-link-btn category-host-list-handler\" aria-label=\"Cookie Details button opens Cookie List menu\" data-parent-id=\"C0003\">Cookies Details‎\u003c/button>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"ot-accordion-layout ot-cat-item ot-vs-config\" data-optanongroupid=\"C0013\">\u003cbutton aria-expanded=\"false\" ot-accordion=\"true\" aria-controls=\"ot-desc-id-C0013\" aria-labelledby=\"ot-header-id-C0013\">\u003c/button>\u003c!-- Accordion
