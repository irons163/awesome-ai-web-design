00, and 3.51% AER (variable) on balances above £200,000. A blended rate applies when your balance exceeds £200,000.\u003c/p>\u003cp>²INVESTMENT SERVICES: capital at risk.\u003c/p>\u003cp>Revolut Trading Ltd provides a non-advised execution-only service in shares. Revolut Trading Ltd does not provide investment advice or personal recommendations. You, as an individual investor, must make your own decisions, seeking independent professional advice if you are unsure as to the suitability or appropriateness of any investment for your individual circumstances or needs.\u003c/p>\u003cp>The value of investments can go up as well as down and you may receive less than your original investment or lose the value of your entire initial investment. Past performance and forecasts are not reliable indicators of future results. Currency rate fluctuations can adversely impact the overall returns on your original investment. Any trades outside of your monthly allowance are charged at 0.25% of the order amount if you are a Standard, Plus, Premium, or Metal customer, or at 0.12% of the order amount if you are an Ultra/Trading Pro customer. \u003ca class=\"Box-rui__sc-1475jr3-0 Text-rui__sc-1mtagir-0 Link__StyledText-rui__sc-1ykr1od-0 ijmNMx bZRNkV bgJNmI ez4kjs2\" rel=\"noopener\" target=\"_blank\" href=\"https://help.revolut.com/help/wealth/stocks/trading-stocks/trading-fees/what-fees-will-i-be-charged-for-my-trading/\">Read more on these fees\u003c/a>. Further information about the investment service provided by Revolut Trading Ltd can be found in the \u003ca class=\"Box-rui__sc-1475jr3-0 Text-rui__sc-1mtagir-0 Link__StyledText-rui__sc-1ykr1od-0 ijmNMx bZRNkV bgJNmI ez4kjs2\" rel=\"noopener\" target=\"_blank\" href=\"https://www.revolut.com/legal/RTL-terms-of-business/\">Terms of Business\u003c/a>, \u003ca class=\"Box-rui__sc-1475jr3-0 Text-rui__sc-1mtagir-0 Link__StyledText-rui__sc-1ykr1od-0 ijmNMx bZRNkV bgJNmI ez4kjs2\" rel=\"noopener\" target=\"_blank\" href=\"https://www.revolut
