isible-2kXvf6ah\">\u003cblockquote class=\"zapier-marketing-ui-quote-QwCvgGLg\">“\u003c!-- -->Next Gen Zaps are going to help us move faster as we continue our AI transformation, giving more employees the chance to build, experiment, and become better at this new way of working.\u003c!-- -->”\u003c/blockquote>\u003c/div>\u003cdiv class=\"zapier-marketing-ui-reveal-tf2-Jbgm zapier-marketing-ui-visible-2kXvf6ah\">\u003cfigcaption class=\"zapier-marketing-ui-author-YshYLp0r zapier-marketing-ui-bodyLG-GndWp1lp zapier-marketing-ui-fontSemibold-RL0Ny-YL zapier-marketing-ui-textBalance-R8PQEvg1\">— \u003ccite>Kelly Scheib\u003c/cite>\u003cbr>Chief People Officer, Crunchbase\u003c/figcaption>\u003c/div>\u003c/figure>\u003c/div>\u003cdiv class=\"zapier-marketing-ui-media-OmHmMLqK zapier-marketing-ui-reveal-tf2-Jbgm zapier-marketing-ui-visible-2kXvf6ah\">\u003cimg alt=\"Crunchbase\" loading=\"eager\" width=\"800\" height=\"600\" decoding=\"async\" data-nimg=\"1\" style=\"color:transparent;width:100%;height:auto\" src=\"zapier-assets/oct10/43ffd8fb84241078f1ce.webp\">\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"FluidDeterminismSection_root__KmSpH\" aria-labelledby=\"fluid-determinism-heading\">\u003cdiv class=\"FluidDeterminismSection_container__xLO3N zapier-marketing-ui-containerXL-bJQqL2R5\">\u003cheader class=\"FluidDeterminismSection_header__kkyMa\">\u003cdiv class=\"FluidDeterminismSection_eyebrow__QzYf7 zapier-marketing-ui-reveal-tf2-Jbgm zapier-marketing-ui-visible-2kXvf6ah\">\u003cp>Adjust automatically\u003c/p>\u003c/div>\u003cdiv class=\"zapier-marketing-ui-reveal-tf2-Jbgm zapier-marketing-ui-visible-2kXvf6ah\">\u003ch2 id=\"fluid-determinism-heading\" class=\"FluidDeterminismSection_heading__CEwI0\">The Fluid Determinism difference\u003c/h2>\u003c/div>\u003cdiv class=\"zapier-marketing-ui-reveal-tf2-Jbgm zapier-marketing-ui-visible-2kXvf6ah\">\u003cp class=\"FluidDeterminismSection_intro__r0NS8\">Fluid Determinism is Zapier’s unique approach to cost-effective, reliable AI. You build with natural language; Zapier suggests where to use AI and then adjusts your workflow as it runs—reducing token use for steps that run the same way every time but adding it back when the unexpected happens.\u003c/p>\u003c/div>\u003c/header>\u003cdiv class=\"FluidDeterminismSection_interactive__IPpSK\">\u003cdiv class=\"FluidDeterminismSection_sliderRow__Fw4mL zapier-marketing-ui-reveal-tf2-Jbgm zapier-marketing-ui-visible-2kXvf6ah\">\u003cbutton type=\"button\" class=\"FluidDeterminismSection_sliderArrow__tvPBm\" aria-label=\"Previous agency level\" disabled=\"\">\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" class=\"zapier-zinnia-icons__icon__8f1EW1A1\" style=\"--color:inherit;--size:20px\" data-name=\"arrowSmallLeft\" data-testid=\"zinnia-icons--arrowSmallLeft\" size=\"20\" color=\"inherit\" name=\"arrowSmallLeft\" data-block=\"false\" data-pointer-events=\"true\" data-animate-fill=\"false\">\u003cpath d=\"M9.3002 12L15.1802 5H12.5602L6.7002 12L12.5602 19H15.1802L9.3002 12Z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv class=\"FluidDeterminismSection_sliderWrap__rDDTQ\">\u003cdiv class=\"FluidDeterminismSection_trackHitArea__GIiZn\">\u003cdiv class=\"FluidDeterminismSection_track__CbsS4\">\u003cdiv class=\"FluidDeterminismSection_trackFill__8bsaq\" style=\"--fill:11.33%\" aria-hidden=\"true\">\u003c/div>\u003cbutton type=\"button\" class=\"FluidDeterminismSection_trackStop__nYmYf FluidDeterminismSection_trackStopActive__qOzqF\" style=\"left:11.33%\" aria-label=\"Go to Deterministic\" aria-current=\"step\">\u003c/button>\u003cbutton type=\"button\" class=\"FluidDeterminismSection_trackStop__nYmYf\" style=\"left:37.11%\" aria-label=\"Go to Deterministic + AI\">\u003c/button>\u003cbutton type=\"button\" class=\"FluidDeterminismSection_trackStop__nYmYf\" style=\"left:62.97%\" aria-label=\"Go to Deterministic + agent\">\u003c/button>\u003cbutton type=\"button\" class=\"FluidDeterminismSection_trackStop__nYmYf\" style=\"left:100%\" aria-label=\"Go to Fully agentic\">\u003c/button>\u003c/div>\u003cdiv class=\"FluidDeterminismSection_thumb__9wWZ1\" style=\"left:11.33%\" role=\"slider\" tabindex=\"0\" aria-valuemin=\"0\" aria-valuemax=\"3\" aria-valuenow=\"0\" aria-valuetext=\"Deterministic\">\u003c/div>\u003c/div>\u003c/div>\u003cbutton type=\"button\" class=\"FluidDeterminismSection_sliderArrow__tvPBm\" aria-label=\"Next agency level\">\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" class=\"zapier-zinnia-icons__icon__8f1EW1A1\" style=\"--color:inherit;--size:20px\" data-name=\"arrowSmallRight\" data-testid=\"zinnia-icons--arrowSmallRight\" size=\"20\" color=\"inherit\" name=\"arrowSmallRight\" data-block=\"false\" data-pointer-events=\"true\" data-animate-fill=\"false\">\u003cpath d=\"M11.4398 5H8.81982L14.6998 12L8.81982 19H11.4398L17.2998 12L11.4398 5Z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003cdiv class=\"FluidDeterminismSection_cards__qPs75\" role=\"tablist\" aria-label=\"Agency levels\">\u003cbutton type=\"button\" role=\"tab\" id=\"fluid-determinism-tab-deterministic\" aria-selected=\"true\" aria-controls=\"fluid-determinism-panel-deterministic\" class=\"FluidDeterminismSection_card__AK3PR FluidDeterminismSection_cardActive__N_tY6\">\u003ch3 class=\"FluidDeterminismSection_cardTitle__MhxAo\">Deterministic\u003c/h3>\u003cp class=\"FluidDeterminismSection_cardDescription__Tzik4\">You choose the tools and steps. Every step follows fixed rules and runs the same way every time.\u003c/p>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"fluid-determinism-tab-deterministic-ai\" aria-selected=\"false\" aria-controls=\"fluid-determinism-panel-deterministic-ai\" class=\"FluidDeterminismSection_card__AK3PR\">\u003ch3 class=\"FluidDeterminismSection_cardTitle__MhxAo\">Deterministic + AI\u003c/h3>\u003cp class=\"FluidDeterminismSection_cardDescription__Tzik4\">AI handles a single task in a workflow, like writing or summarizing. Deterministic steps handle the rest.\u003c/p>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"fluid-determinism-tab-deterministic-agent\" aria-selected=\"false\" aria-controls=\"fluid-determinism-panel-deterministic-agent\" class=\"FluidDeterminismSection_card__AK3PR\">\u003ch3 class=\"FluidDeterminismSection_cardTitle__MhxAo\">Deterministic + agent\u003c/h3>\u003cp class=\"FluidDeterminismSection_cardDescription__Tzik4\">An embedded agent uses approved tools and instructions to complete multi-step work, then hands it off to deterministic steps.\u003c/p>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"fluid-determinism-tab-fully-agentic\" aria-selected=\"false\" aria-controls=\"fluid-determinism-panel-fully-agentic\" class=\"FluidDeterminismSection_card__AK3PR\">\u003ch3 class=\"FluidDeterminismSection_cardTitle__MhxAo\">Fully agentic\u003c/h3>\u003cp class=\"FluidDeterminismSection_cardDescription__Tzik4\">An agent plans, adapts, and works across tools to achieve your goal, bringing you in for review as needed.\u003c/p>\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"FluidDeterminismSection_detail__2pFQ3\" id=\"fluid-determinism-panel-deterministic\" role=\"tabpanel\" aria-labelledby=\"fluid-determinism-tab-deterministic\">\u003cdiv class=\"FluidDeterminismSection_media__c3m4v FluidDeterminismSection_mediaWithImage__IZHca\" data-step=\"deterministic\">\u003cimg alt=\"Ticket intake workflow diagram\" loading=\"eager\" width=\"1000\" height=\"1000\" decoding=\"async\" data-nimg=\"1\" class=\"FluidDeterminismSection_mediaImage__Rgkxf FluidDeterminismSection_mediaImageActive__q2drf\" style=\"color:transparent\" src=\"zapier-assets/oct10/652977f7bc6a36051320.webp\">\u003cimg alt=\"Drafted replies workflow diagram\" loading=\"eager\" width=\"1000\" height=\"1000\" decoding=\"async\" data- sible-2kXvf6ah\">\u003cp>Adjust automatically\u003c/p>\u003c/div>\u003cdiv class=\"zapier-marketing-ui-reveal-tf2-Jbgm zapier-marketing-ui-visible-2kXvf6ah\">\u003ch2 id=\"fluid-determinism-heading\" class=\"FluidDeterminismSection_heading__CEwI0\">The Fluid Determinism difference\u003c/h2>\u003c/div>\u003cdiv class=\"zapier-marketing-ui-reveal-tf2-Jbgm zapier-marketing-ui-visible-2kXvf6ah\">\u003cp class=\"FluidDeterminismSection_intro__r0NS8\">Fluid Determinism is Zapier’s unique approach to cost-effective, reliable AI. You build with natural language; Zapier suggests where to use AI and then adjusts your workflow as it runs—reducing token use for steps that run the same way every time but adding it back when the unexpected happens.\u003c/p>\u003c/div>\u003c/header>\u003cdiv class=\"FluidDeterminismSection_interactive__IPpSK\">\u003cdiv class=\"FluidDeterminismSection_sliderRow__Fw4mL zapier-marketing-ui-reveal-tf2-Jbgm zapier-marketing-ui-visible-2kXvf6ah\">\u003cbutton type=\"button\" class=\"FluidDeterminismSection_sliderArrow__tvPBm\" aria-label=\"Previous agency level\" disabled=\"\">\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" class=\"zapier-zinnia-icons__icon__8f1EW1A1\" style=\"--color:inherit;--size:20px\" data-name=\"arrowSmallLeft\" data-testid=\"zinnia-icons--arrowSmallLeft\" size=\"20\" color=\"inherit\" name=\"arrowSmallLeft\" data-block=\"false\" data-pointer-events=\"true\" data-animate-fill=\"false\">\u003cpath d=\"M9.3002 12L15.1802 5H12.5602L6.7002 12L12.5602 19H15.1802L9.3002 12Z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv class=\"FluidDeterminismSection_sliderWrap__rDDTQ\">\u003cdiv class=\"FluidDeterminismSection_trackHitArea__GIiZn\">\u003cdiv class=\"FluidDeterminismSection_track__CbsS4\">\u003cdiv class=\"FluidDeterminismSection_trackFill__8bsaq\" style=\"--fill:11.33%\" aria-hidden=\"true\">\u003c/div>\u003cbutton type=\"button\" class=\"FluidDeterminismSection_trackStop__nYmYf FluidDeterminismSection_trackStopActive__qOzqF\" style=\"left:11.33%\" aria-label=\"Go to Deterministic\" aria-current=\"step\">\u003c/button>\u003cbutton type=\"button\" class=\"FluidDeterminismSection_trackStop__nYmYf\" style=\"left:37.11%\" aria-label=\"Go to Deterministic + AI\">\u003c/button>\u003cbutton type=\"button\" class=\"FluidDeterminismSection_trackStop__nYmYf\" style=\"left:62.97%\" aria-label=\"Go to Deterministic + agent\">\u003c/button>\u003cbutton type=\"button\" class=\"FluidDeterminismSection_trackStop__nYmYf\" style=\"left:100%\" aria-label=\"Go to Fully agentic\">\u003c/button>\u003c/div>\u003cdiv class=\"FluidDeterminismSection_thumb__9wWZ1\" style=\"left:11.33%\" role=\"slider\" tabindex=\"0\" aria-valuemin=\"0\" aria-valuemax=\"3\" aria-valuenow=\"0\" aria-valuetext=\"Deterministic\">\u003c/div>\u003c/div>\u003c/div>\u003cbutton type=\"button\" class=\"FluidDeterminismSection_sliderArrow__tvPBm\" aria-label=\"Next agency level\">\u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" class=\"zapier-zinnia-icons__icon__8f1EW1A1\" style=\"--color:inherit;--size:20px\" data-name=\"arrowSmallRight\" data-testid=\"zinnia-icons--arrowSmallRight\" size=\"20\" color=\"inherit\" name=\"arrowSmallRight\" data-block=\"false\" data-pointer-events=\"true\" data-animate-fill=\"false\">\u003cpath d=\"M11.4398 5H8.81982L14.6998 12L8.81982 19H11.4398L17.2998 12L11.4398 5Z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003cdiv class=\"FluidDeterminismSection_cards__qPs75\" role=\"tablist\" aria-label=\"Agency levels\">\u003cbutton type=\"button\" role=\"tab\" id=\"fluid-determinism-tab-deterministic\" aria-selected=\"true\" aria-controls=\"fluid-determinism-panel-deterministic\" class=\"FluidDeterminismSection_card__AK3PR FluidDeterminismSection_cardActive__N_tY6\">\u003ch3 class=\"FluidDeterminismSection_cardTitle__MhxAo\">Deterministic\u003c/h3>\u003cp class=\"FluidDeterminismSection_cardDescription__Tzik4\">You choose the tools and steps. Every step follows fixed rules and runs the same way every time.\u003c/p>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"fluid-determinism-tab-deterministic-ai\" aria-selected=\"false\" aria-controls=\"fluid-determinism-panel-deterministic-ai\" class=\"FluidDeterminismSection_card__AK3PR\">\u003ch3 class=\"FluidDeterminismSection_cardTitle__MhxAo\">Deterministic + AI\u003c/h3>\u003cp class=\"FluidDeterminismSection_cardDescription__Tzik4\">AI handles a single task in a workflow, like writing or summarizing. Deterministic steps handle the rest.\u003c/p>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"fluid-determinism-tab-deterministic-agent\" aria-selected=\"false\" aria-controls=\"fluid-determinism-panel-deterministic-agent\" class=\"FluidDeterminismSection_card__AK3PR\">\u003ch3 class=\"FluidDeterminismSection_cardTitle__MhxAo\">Deterministic + agent\u003c/h3>\u003cp class=\"FluidDeterminismSection_cardDescription__Tzik4\">An embedded agent uses approved tools and instructions to complete multi-step work, then hands it off to deterministic steps.\u003c/p>\u003c/button>\u003cbutton type=\"button\" role=\"tab\" id=\"fluid-determinism-tab-fully-agentic\" aria-selected=\"false\" aria-controls=\"fluid-determinism-panel-fully-agentic\" class=\"FluidDeterminismSection_card__AK3PR\">\u003ch3 class=\"FluidDeterminismSection_cardTitle__MhxAo\">Fully agentic\u003c/h3>\u003cp class=\"FluidDeterminismSection_cardDescription__Tzik4\">An agent plans, adapts, and works across tools to achieve your goal, bringing you in for review as needed.\u003c/p>\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"FluidDeterminismSection_detail__2pFQ3\" id=\"fluid-determinism-panel-deterministic\" role=\"tabpanel\" aria-labelledby=\"fluid-determinism-tab-deterministic\">\u003cdiv class=\"FluidDeterminismSection_media__c3m4v FluidDete ection_carouselItem__92XNw\">\u003cdiv class=\"CarouselSection_card__upaJc\">\u003cdiv class=\"CarouselSection_logoContainer__Bb8JD\">\u003cimg alt=\"Mercari\" loading=\"eager\" width=\"120\" height=\"24\" decoding=\"async\" data-nimg=\"1\" class=\"CarouselSection_logo__e4LdA\" style=\"color:transparent;width:auto;height:100%;max-height:24px\" src=\"zapier-assets/oct10/301f89b4d35dbc8a98b0.svg\">\u003c/div>\u003cfigure class=\"CarouselSection_quoteContainer__7dRA8\">\u003cdiv class=\"CarouselSection_quoteTextContainer__cgHWl\">\u003csvg width=\"20\" height=\"16\" viewBox=\"0 0 20 16\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\u003cpath d=\"M15.2229 0H19.2L15.168 8.09256H19.2V16H10.9989V8.09256L15.2229 0ZM4.19657 0H8.20114L4.14171 8.09256H8.20114V16H0V8.09256L4.19657 0Z\" fill=\"currentColor\">\u003c/path>\u003c/svg>\u003cblockquote class=\"CarouselSection_quoteText__rQisP\">Implementing AI in customer service is not about replacing human agents. It’s about giving customers the right answer as quickly as possible [freeing] up our human agents to focus more on our customers with complex cases.\u003c/blockquote>\u003c/div>\u003cfigcaption class=\"CarouselSection_authorContainer__aGvTG\">— \u003c!-- -->Eric McNulty\u003c!-- -->, Systems Manager for Customer Experience at Mercari US\u003c/figcaption>\u003c/figure>\u003cdiv class=\"CarouselSection_statsContainer__EJLRl\">\u003cdiv class=\"CarouselSection_statContainer__O7B5S\">\u003cp class=\"CarouselSection_stat__nvRt6\">47,000\u003c/p>\u003cp class=\"CarouselSection_statDescription__f2ozR\">tickets resolved entirely by Zapier each month\u003c/p>\u003c/div>\u003cdiv class=\"CarouselSection_statContainer__O7B5S\">\u003cp class=\"CarouselSection_stat__nvRt6\">3,000+\u003c/p>\u003cp class=\"CarouselSection_statDescription__f2ozR\">agent hours freed each month\u003c/p>\u003c/div>\u003c/div>\u003ca class=\"CarouselSection_actionContainer__3zG_L\" aria-label=\"Read full Mercari story\" href=\"htt
