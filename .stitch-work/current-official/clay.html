ordion__wrapper__eWbmr\">\u003cdiv class=\"CapabilitiesTop_Accordion__item__I39ki\">\u003cbutton class=\"CapabilitiesTop_Accordion__button__wslIf CapabilitiesTop_Accordion__button_triggered__olaxB\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cdiv class=\"CapabilitiesTop_Accordion__buttonContainer__x57W5\">\u003cspan class=\"CapabilitiesTop_Accordion__title__lMxEZ\">Branding\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"CapabilitiesTop_Accordion__icon__RPcDo\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/div>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"CapabilitiesTop_Accordion__content__jLtV_\">\u003cdiv class=\"CapabilitiesTop_Accordion__text__O9hiw\">\u003cp>A brand is more than just a logo or some colors. It’s how people recognize and connect with your business. We build strong visual and verbal identities, design the assets you need, and create clear brand guidelines so your message stays consistent everywhere.\u003c/p>\u003c/div>\u003cdiv class=\"CapabilitiesTop_Accordion__imageWrapper__uLuxk\">\u003cimg alt=\"\" fetchpriority=\"high\" width=\"810\" height=\"810\" decoding=\"async\" data-nimg=\"1\" src=\"clay-assets/oct10/54a8d6827bd6624191c1.avif\" style=\"color: transparent;\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"CapabilitiesTop_Accordion__item__I39ki\">\u003cbutton class=\"CapabilitiesTop_Accordion__button__wslIf CapabilitiesTop_Accordion__button_triggered__olaxB\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cdiv class=\"CapabilitiesTop_Accordion__buttonContainer__x57W5\">\u003cspan class=\"CapabilitiesTop_Accordion__title__lMxEZ\">Digital Products\u003c/s 8qQ\">\u003cspan>Created: May 6, 2026\u003c/span>\u003cdiv class=\"ArticleItem_ArticleItem__divider__u5oNR\">\u003c/div>\u003cspan class=\"ArticleItem_ArticleItem__timeToRead__HSc8f\">1 min read\u003c/span>\u003c/div>\u003c/div>\u003c/a>\u003c/li>\u003c/ul>\u003cdiv class=\"FeaturedArticles_FeaturedArticles__linkContainer__a_mli\">\u003ca href=\"https://clay.global/blog\" class=\"LinkSanity_Link__pMW_u LinkSanity_Link_underline__hVo5A LinkSanity_Link_inverted__8CVuH LinkSanity_Link_icon__j0gku LinkSanity_Link_icon_triggered__x0Vtz\">\u003cspan class=\"Text Text_span Text_Text_2__VDf2J LinkSanity_Text__hRdee\">\u003cspan class=\"LinkSanity_Label__y3E5E LinkSanity_Label_triggered__RJC6h\">Visit blog\u003c/span>\u003csvg viewBox=\"0 0 24 24\" preserveAspectRatio=\"none\" fill=\"currentColor\" role=\"presentation\" class=\"LinkSanity_Icon__JmAKV LinkSanity_Icon_invertedToGrey__vktBn LinkSanity_Icon_right__9NwEP LinkSanity_Icon_triggered__kerGW\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M16.6075 11.8572L13.255 8.40897L14.1388 7.5L19 12.5L14.1388 17.5L13.255 16.591L16.6075 13.1428H5V11.8572H16.6075Z\">\u003c/path>\u003c/svg>\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"Section_Section__jxTsy Section_Section_overflown__3Znwp Section_Section_black__YMNYw FAQ_FAQ__reTkm\">\u003cdiv class=\"Container_Container__FVHN5\">\u003ch2 class=\"Heading_Heading_level_2__PALva Heading_Heading_animation--fade-position__FOheh Heading_Heading_triggered__r_NhZ FAQ_Title__NGeCw\">FAQ\u003c/h2>\u003cdiv>\u003cdiv class=\"FAQ_Dropdown__visible__Cth5k FAQ_Dropdown__7xGvC\">\u003cbutton class=\"FAQ_Dropdown__button__a8akJ\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p FAQ_Dropdown__buttonTitle__P0KAl\">What are your core services as a UX design and branding firm?\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"FAQ_Dropdown__icon__6qzfK\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"\">\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">At Clay, user experience is not just a capability but the cornerstone of our approach. We first began as a UX design agency in San Francisco, focusing on mobile apps and enterprise/SaaS software. \u003cbr>\u003cbr>However, our passion for branding and the demand from our clients led us to expand our offering to provide full-service brand design practice and web design and development of marketing websites.\u003cbr>\u003cbr>Today, our projects encompass a wide range, from building new products and defining brands to revitalizing existing mobile apps, websites, and enterprise software. We specialize in crafting digital products that wholeheartedly embody the brand's personality and deliver delightful experiences to your customers.\u003cbr>\u003cbr>Our team handles every aspect required to bring a digital product to life. This includes user research, product strategy, branding, user interface and experience design, usability testing, prototyping, web design, and development.\u003cbr>\u003cbr>Furthermore, we boast an in-house content production studio that provides creative direction, 2D/3D design, illustration and iconography, motion design, animation, sound design, photo/video, and copywriting services.\u003cbr>\u003cbr>For web projects, we integrate considerations for SEO into our process to ensure that our client's websites are optimized for search engines; however, SEO is not offered as a standalone service.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"FAQ_Dropdown__visible__Cth5k FAQ_Dropdown__7xGvC\">\u003cbutton class=\"FAQ_Dropdown__button__a8akJ\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p FAQ_Dropdown__buttonTitle__P0KAl\">What separates Clay from other branding and web design agencies?\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"FAQ_Dropdown__icon__6qzfK\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"\">\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">In a saturated market of excellent UX design and branding agencies, it's challenging to stand out. At Clay, we believe our client's success is intertwined with our own. We forge enduring partnerships based on trust and mutual growth, going beyond world-class services.\u003cbr>\u003cbr>When you choose us, you collaborate directly with our dedicated team, who genuinely care about your success. Our cofounders oversee every project, while a design director leads the way, ensuring thorough design reviews and involvement in project details.\u003cbr>\u003cbr>Communication and transparency drive all our interactions, guaranteeing a premium client experience from start to finish. Our agility stems from working with startups, and our refined project management approach comes from enterprise experience.\u003cbr>\u003cbr>Unlike traditional design firms, we integrate branding and product expertise in one place, boasting cross-disciplinary teams for each project. This ensures your app or website represents your brand effectively while delivering an unforgettable user experience.\u003cbr>\u003cbr>Lastly, we specialize in creating scalable designs that support your long-term business goals. Our portfolio showcases websites and products untouched for over five years, proving our future-proof capabilities.\u003c/p>\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">\u003c/p>\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">For teams evaluating partners, we share curated agency rankings, including the \u003ca href=\"https://clay.global/blog/top-branding-agencies\" target=\"_blank\" tabindex=\"-1\">Top Branding Agencies\u003c/a> and \u003ca href=\"https://clay.global/blog/best-web-design-agencies\" target=\"_blank\" tabindex=\"-1\">Top Web Design Agencies\u003c/a>, on our blog.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"FAQ_Dropdown__visible__Cth5k FAQ_Dropdown__7xGvC\">\u003cbutton class=\"FAQ_Dropdown__button__a8akJ\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p FAQ_Dropdown__buttonTitle__P0KAl\">Do you work with clients in different timezones?\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"FAQ_Dropdown__icon__6qzfK\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"\">\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">We have extensive experience working with clients in various time zones. Based in San Francisco, we operate as a remote-first company with team members across the United States, Europe, and South-East Asia. This global presence allows us to serve clients worldwide, regardless of location.\u003cbr>\u003cbr>Over the past 12 years, we have perfected our remote collaboration model, enabling seamless work with clients from Saudi Arabia, China, Australia, Germany, the UK, and many other countries. We understand the challenges of different time zones and have implemented effective communication and project management strategies to overcome them.\u003cbr>\u003cbr>Our team excels at coordinating and scheduling meetings to accommodate clients' time preferences and availability across different regions. We prioritize clear and timely communication, leveraging various collaboration tools and platforms to maintain constant connectivity and streamline project workflows.\u003cbr>\u003cbr>Working with clients across diverse time zones has expanded our agency's capabilities and deepened our understanding of global markets. It has fostered an adaptive and efficient culture within our team, allowing us to consistently deliver exceptional results while respecting and embracing our clients' unique needs and perspectives worldwide.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"FAQ_Dropdown__visible__Cth5k FAQ_Dropdown__7xGvC\">\u003cbutton class=\"FAQ_Dropdown__button__a8akJ\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p FAQ_Dropdown__buttonTitle__P0KAl\">How much does hiring you for a design project cost?\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"FAQ_Dropdown__icon__6qzfK\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"\">\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">At Clay, we understand the importance of flexibility in budget and support for our partners. We offer a blended rate for our services and work with our clients to determine what level of support we can provide based on their budgetary constraints.\u003cbr>\u003cbr>We offer three engagement models: time &amp; materials, fixed fee, and retainer. Following a series of discovery conversations and project briefings, our team will recommend the most suitable model for your needs. We will then create a customized proposal, including a timeline and estimated cost.\u003cbr>\u003cbr>We aim to deliver the best possible solutions to our partners, tailored to their specific requirements. Whether it entails a comprehensive range of services or a customized approach that aligns with their financial constraints, we strive to meet their unique needs.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"FAQ_Dropdown__visible__Cth5k FAQ_Dropdown__7xGvC\">\u003cbutton class=\"FAQ_Dropdown__button__a8akJ\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p FAQ_Dropdown__buttonTitle__P0KAl\">Do you work with startups?\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"FAQ_Dropdown__icon__6qzfK\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"\">\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">Yes, we work with clients of all sizes, from enterprise-level organizations to startups. We are passionate about helping startups bring their ideas to life and achieve their goals through the power of design and technology. Additionally, we possess the expertise to assist in scaling your product or marketing efforts to enter new markets or reach different target audiences.\u003cbr>\u003cbr>One of our most common scenarios involves preparing SaaS startups to cater to enterprise clients by revamping their brand, product, and marketing site. We have partnered with numerous early-stage companies, including Coinbase, Uber, SendGrid, and MoneyLion, who have emerged as leaders in their respective industries.\u003cbr>\u003cbr>Conversely, other startups we have collaborated with, such as Earnin, experienced significant success after we redesigned their app, securing over $100M in additional venture funding. \u003cbr>\u003cbr>If you are a startup seeking to discuss your project needs, we would be delighted to initiate the conversation. To schedule a consultation with our team, please get in touch with us at hey@clay.global. We will work closely with you to comprehend your vision, goals, and budget, ensuring a tailored approach to your project.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"FAQ_Dropdown__visible__Cth5k FAQ_Dropdown__7xGvC\">\u003cbutton class=\"FAQ_Dropdown__button__a8akJ\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p FAQ_Dropdown__buttonTitle__P0KAl\">Can you help us redesign our B2B/enterprise software?\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"FAQ_Dropdown__icon__6qzfK\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"\">\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">We're one of the few user experience agencies focusing on enterprise UX design and the digital transformation of legacy business software. Our years of experience have allowed us to refine our process, enabling us to revitalize B2B software for top-tier Fortune 100 companies like ADP, Amazon, VMware, and Cisco.\u003cbr>\u003cbr>Through our ultra-collaborative process and design thinking approach, we create consumer-grade user experiences for business users. We prioritize scalability and longevity by empowering our clients' in-house teams with robust design systems. This ensures continuity and adaptability, enabling the organization to evolve and grow seamlessly.\u003cbr>\u003cbr>We usually function as an independent unit within the organizational structure. Operating like a startup, we inject agility and fresh perspectives into the sometimes bureaucratic enterprise environment. This approach helps us navigate complex hierarchies and decision-making processes swiftly and efficiently, delivering innovative solutions.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"Footer_Footer__jAFa5 Footer_Footer_white__4PNoe Layout_Displaced__aKdPG\">\u003cdiv class=\"Container_Container__FVHN5 Footer_Container__zBpzr\">\u003cdiv class=\"Footer_ContactsContainer__VCles\">\u003cdiv class=\"Footer_TitleWrapper__uuTfH\">\u003ch2 class=\"Heading_Heading_level_1__ol8hg Heading_Heading_animation--fade__r3Hno Heading_Heading_triggered__r_NhZ Footer_Title__9izok\">Let’s Talk\u003c/h2>\u003ca href=\"mailto:hey@clay.global\" target=\"_blank\" rel=\"noreferrer noopener\" class=\"LinkSanity_Link__pMW_u LinkSanity_Link_underline__hVo5A LinkSanity_large__X4Klv Footer_ContactsEmailLink__LbmA6 Footer_VisibleText2__GOvaU\" aria-label=\"Email\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p LinkSanity_Text__hRdee\">\u003cspan class=\"LinkSanity_Label__y3E5E\">hey@clay.global\u003c/span>\u003c/span>\u003c/a>\u003ca href=\"tel:+1 415 796 6262\" target=\"_blank\" rel=\"noreferrer noopener\" class=\"LinkSanity_Link__pMW_u ertical_Container__SHBxC GalleryFullWidth_Text__xH26O GalleryFullWidth_Text_triggered__0dIVI\">\u003cdiv class=\"TextVertical_TextBlock__ksVs4\">\u003cdiv class=\"TextBlock_Paragraph_level-1__Efwt2\">\u003cp class=\"Text Text_p Text_Text_1__3j52p TextArea_Paragraph__d7HC6\">Our cross-disciplinary team combines strategy, branding, UX design, and technology for swift, impactful results. Working as one team with our clients, we merge human creativity with AI-driven efficiency to consistently exceed expectations.\u003c/p>\u003c/div>\u003ca class=\"LinkSanity_Link__pMW_u LinkSanity_Link_underline__hVo5A LinkSanity_Link_icon__j0gku LinkSanity_Link_icon_triggered__x0Vtz\" href=\"https://clay.global/about\">\u003cspan class=\"Text Text_span Text_Text_2__VDf2J LinkSanity_Text__hRdee\">\u003cspan class=\"LinkSanity_Label__y3E5E LinkSanity_Label_triggered__RJC6h\">Get to know us\u003c/span>\u003csvg viewBox=\"0 0 24 24\" preserveAspectRatio=\"none\" fill=\"currentColor\" role=\"presentation\" class=\"LinkSanity_Icon__JmAKV LinkSanity_Icon_right__9NwEP LinkSanity_Icon_triggered__kerGW\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M16.6075 11.8572L13.255 8.40897L14.1388 7.5L19 12.5L14.1388 17.5L13.255 16.591L16.6075 13.1428H5V11.8572H16.6075Z\">\u003c/path>\u003c/svg>\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"Section_Section__jxTsy Section_Section_overflown__3Znwp Section_Section_black__YMNYw FeaturedArticles_FeaturedArticles__QZvun\">\u003cdiv class=\"Container_Container__FVHN5\">\u003ch2 class=\"Heading_Heading_level_2__PALva Heading_Heading_animation--fade-position__FOheh Heading_Heading_triggered__r_NhZ FeaturedArticles_FeaturedArticles__title__KsldT\" style=\"transition-delay: calc(70ms + var(--menu-follow-delay));\">Featured News\u003c/h2>\u003cul class=\"FeaturedArticles_FeaturedArticles__list__JqzbO\">\u003cli class=\"FeaturedArticles_FeaturedArticles__listItem__4Ps6o FeaturedArticles_FeaturedArticles__listItem_trig de to Buttons in Web Design for 2026\u003c/h3>\u003c/div>\u003cdiv class=\"ArticleItem_ArticleItem__date__8F8qQ\">\u003cspan>Created: Apr 21, 2026\u003c/span>\u003cdiv class=\"ArticleItem_ArticleItem__divider__u5oNR\">\u003c/div>\u003cspan>Updated: May 14, 2026\u003c/span>\u003cdiv class=\"ArticleItem_ArticleItem__divider__u5oNR\">\u003c/div>\u003cspan class=\"ArticleItem_ArticleItem__timeToRead__HSc8f\">12 min read\u003c/span>\u003c/div>\u003c/div>\u003c/a>\u003c/li>\u003cli class=\"FeaturedArticles_FeaturedArticles__listItem__4Ps6o FeaturedArticles_FeaturedArticles__listItem_triggered__jZ8gQ\" style=\"transition-delay: 340ms;\">\u003ca class=\"ArticleItem_ArticleItem__fFy1Q\" href=\"https://clay.global/blog/webby-2026\">\u003cdiv class=\"ArticleItem_ArticleItem__imageContainer__aWugP\">\u003cimg alt=\"Clay Global Shows Up Strong at The Webby Awards 2026 - Clay\" loading=\"lazy\" width=\"2338\" height=\"1238\" decoding=\"async\" data-nimg=\"1\" class=\"ArticleItem_ArticleItem__image__YxOtH\" src=\"clay-assets/oct10/bbf61dfc060a5217f214.avif\" style=\"color: transparent;\">\u003c/div>\u003cdiv class=\"ArticleItem_ArticleItem__textContainer__CR_ut\">\u003cdiv>\u003cp class=\"ArticleItem_ArticleItem__category__J3llQ\">News\u003c/p>\u003ch3 class=\"Heading_Heading_level_3__o07Pq ArticleItem_ArticleItem__title__Ztkem\">Clay Global Shows Up Strong at The Webby Awards 2026\u003c/h3>\u003c/div>\u003cdiv class=\"ArticleItem_ArticleItem__date__8F8qQ\">\u003cspan>Created: May 6, 2026\u003c/span>\u003cdiv class=\"ArticleItem_ArticleItem__divider__u5oNR\">\u003c/div>\u003cspan class=\"ArticleItem_ArticleItem__timeToRead__HSc8f\">1 min read\u003c/span>\u003c/div>\u003c/div>\u003c/a>\u003c/li>\u003c/ul>\u003cdiv class=\"FeaturedArticles_FeaturedArticles__linkContainer__a_mli\">\u003ca href=\"https://clay.global/blog\" class=\"LinkSanity_Link__pMW_u LinkSanity_Link_underline__hVo5A LinkSanity_Link_inverted__8CVuH LinkSanity_Link_icon__j0gku LinkSanity_Link_icon_triggered__x0Vtz\">\u003cspan class=\"Text Text_span Text_Text_2__VDf2J LinkSanity_Text__hRdee\">\u003cspan class=\"LinkSanity_Label__y3E5E LinkSanity_Label_triggered__RJC6h\">Visit blog\u003c/span>\u003csvg viewBox=\"0 0 24 24\" preserveAspectRatio=\"none\" fill=\"currentColor\" role=\"presentation\" class=\"LinkSanity_Icon__JmAKV LinkSanity_Icon_invertedToGrey__vktBn LinkSanity_Icon_right__9NwEP LinkSanity_Icon_triggered__kerGW\" xmlns=\"http://www.w3.org/2000/svg\">\u003cpath d=\"M16.6075 11.8572L13.255 8.40897L14.1388 7.5L19 12.5L14.1388 17.5L13.255 16.591L16.6075 13.1428H5V11.8572H16.6075Z\">\u003c/path>\u003c/svg>\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\u003csection class=\"Section_Section__jxTsy Section_Section_overflown__3Znwp Section_Section_black__YMNYw FAQ_FAQ__reTkm\">\u003cdiv class=\"Container_Container__FVHN5\">\u003ch2 class=\"Heading_Heading_level_2__PALva Heading_Heading_animation--fade-position__FOheh Heading_Heading_triggered__r_NhZ FAQ_Title__NGeCw\">FAQ\u003c/h2>\u003cdiv>\u003cdiv class=\"FAQ_Dropdown__visible__Cth5k FAQ_Dropdown__7xGvC\">\u003cbutton class=\"FAQ_Dropdown__button__a8akJ\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p FAQ_Dropdown__buttonTitle__P0KAl\">What are your core services as a UX design and branding firm?\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"FAQ_Dropdown__icon__6qzfK\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"\">\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">At Clay, user experience is not just a capability but the cornerstone of our approach. We first began as a UX design agency in San Francisco, focusing on mobile apps and enterprise/SaaS software. \u003cbr>\u003cbr>However, our passion for branding and the demand from our clients led us to expand our offering to provide full-service brand design practice and web design and development of marketing websites.\u003cbr>\u003cbr>Today, our projects encompass a wide range, from building new products and defining brands to revitalizing existing mobile apps, websites, and enterprise software. We specialize in crafting digital products that wholeheartedly embody the brand's personality and deliver delightful experiences to your customers.\u003cbr>\u003cbr>Our team handles every aspect required to bring a digital product to life. This includes user research, product strategy, branding, user interface and experience design, usability testing, prototyping, web design, and development.\u003cbr>\u003cbr>Furthermore, we boast an in-house content production studio that provides creative direction, 2D/3D design, illustration and iconography, motion design, animation, sound design, photo/video, and copywriting services.\u003cbr>\u003cbr>For web projects, we integrate considerations for SEO into our process to ensure that our client's websites are optimized for search engines; however, SEO is not offered as a standalone service.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"FAQ_Dropdown__visible__Cth5k FAQ_Dropdown__7xGvC\">\u003cbutton class=\"FAQ_Dropdown__button__a8akJ\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p FAQ_Dropdown__buttonTitle__P0KAl\">What separates Clay from other branding and web design agencies?\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"FAQ_Dropdown__icon__6qzfK\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"\">\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">In a saturated market of excellent UX design and branding agencies, it's challenging to stand out. At Clay, we believe our client's success is intertwined with our own. We forge enduring partnerships based on trust and mutual growth, going beyond world-class services.\u003cbr>\u003cbr>When you choose us, you collaborate directly with our dedicated team, who genuinely care about your success. Our cofounders oversee every project, while a design director leads the way, ensuring thorough design reviews and involvement in project details.\u003cbr>\u003cbr>Communication and transparency drive all our interactions, guaranteeing a premium client experience from start to finish. Our agility stems from working with startups, and our refined project management approach comes from enterprise experience.\u003cbr>\u003cbr>Unlike traditional design firms, we integrate branding and product expertise in one place, boasting cross-disciplinary teams for each project. This ensures your app or website represents your brand effectively while delivering an unforgettable user experience.\u003cbr>\u003cbr>Lastly, we specialize in creating scalable designs that support your long-term business goals. Our portfolio showcases websites and products untouched for over five years, proving our future-proof capabilities.\u003c/p>\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">\u003c/p>\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">For teams evaluating partners, we share curated agency rankings, including the \u003ca href=\"https://clay.global/blog/top-branding-agencies\" target=\"_blank\" tabindex=\"-1\">Top Branding Agencies\u003c/a> and \u003ca href=\"https://clay.global/blog/best-web-design-agencies\" target=\"_blank\" tabindex=\"-1\">Top Web Design Agencies\u003c/a>, on our blog.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"FAQ_Dropdown__visible__Cth5k FAQ_Dropdown__7xGvC\">\u003cbutton class=\"FAQ_Dropdown__button__a8akJ\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p FAQ_Dropdown__buttonTitle__P0KAl\">Do you work with clients in different timezones?\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"FAQ_Dropdown__icon__6qzfK\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"\">\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">We have extensive experience working with clients in various time zones. Based in San Francisco, we operate as a remote-first company with team members across the United States, Europe, and South-East Asia. This global presence allows us to serve clients worldwide, regardless of location.\u003cbr>\u003cbr>Over the past 12 years, we have perfected our remote collaboration model, enabling seamless work with clients from Saudi Arabia, China, Australia, Germany, the UK, and many other countries. We understand the challenges of different time zones and have implemented effective communication and project management strategies to overcome them.\u003cbr>\u003cbr>Our team excels at coordinating and scheduling meetings to accommodate clients' time preferences and availability across different regions. We prioritize clear and timely communication, leveraging various collaboration tools and platforms to maintain constant connectivity and streamline project workflows.\u003cbr>\u003cbr>Working with clients across diverse time zones has expanded our agency's capabilities and deepened our understanding of global markets. It has fostered an adaptive and efficient culture within our team, allowing us to consistently deliver exceptional results while respecting and embracing our clients' unique needs and perspectives worldwide.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"FAQ_Dropdown__visible__Cth5k FAQ_Dropdown__7xGvC\">\u003cbutton class=\"FAQ_Dropdown__button__a8akJ\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p FAQ_Dropdown__buttonTitle__P0KAl\">How much does hiring you for a design project cost?\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"FAQ_Dropdown__icon__6qzfK\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"\">\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">At Clay, we understand the importance of flexibility in budget and support for our partners. We offer a blended rate for our services and work with our clients to determine what level of support we can provide based on their budgetary constraints.\u003cbr>\u003cbr>We offer three engagement models: time &amp; materials, fixed fee, and retainer. Following a series of discovery conversations and project briefings, our team will recommend the most suitable model for your needs. We will then create a customized proposal, including a timeline and estimated cost.\u003cbr>\u003cbr>We aim to deliver the best possible solutions to our partners, tailored to their specific requirements. Whether it entails a comprehensive range of services or a customized approach that aligns with their financial constraints, we strive to meet their unique needs.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"FAQ_Dropdown__visible__Cth5k FAQ_Dropdown__7xGvC\">\u003cbutton class=\"FAQ_Dropdown__button__a8akJ\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p FAQ_Dropdown__buttonTitle__P0KAl\">Do you work with startups?\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"FAQ_Dropdown__icon__6qzfK\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"\">\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">Yes, we work with clients of all sizes, from enterprise-level organizations to startups. We are passionate about helping startups bring their ideas to life and achieve their goals through the power of design and technology. Additionally, we possess the expertise to assist in scaling your product or marketing efforts to enter new markets or reach different target audiences.\u003cbr>\u003cbr>One of our most common scenarios involves preparing SaaS startups to cater to enterprise clients by revamping their brand, product, and marketing site. We have partnered with numerous early-stage companies, including Coinbase, Uber, SendGrid, and MoneyLion, who have emerged as leaders in their respective industries.\u003cbr>\u003cbr>Conversely, other startups we have collaborated with, such as Earnin, experienced significant success after we redesigned their app, securing over $100M in additional venture funding. \u003cbr>\u003cbr>If you are a startup seeking to discuss your project needs, we would be delighted to initiate the conversation. To schedule a consultation with our team, please get in touch with us at hey@clay.global. We will work closely with you to comprehend your vision, goals, and budget, ensuring a tailored approach to your project.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"FAQ_Dropdown__visible__Cth5k FAQ_Dropdown__7xGvC\">\u003cbutton class=\"FAQ_Dropdown__button__a8akJ\" aria-haspopup=\"true\" aria-expanded=\"false\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p FAQ_Dropdown__buttonTitle__P0KAl\">Can you help us redesign our B2B/enterprise software?\u003c/span>\u003csvg width=\"1em\" height=\".62em\" viewBox=\"0 0 21 13\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\" class=\"FAQ_Dropdown__icon__6qzfK\">\u003cpath d=\"m1.467 1.732 9.018 8.852 8.684-8.524\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003c/path>\u003c/svg>\u003c/button>\u003cdiv style=\"overflow: hidden; transition-property: height; transition-duration: 0.7s; transition-delay: 0s; transition-timing-function: cubic-bezier(0.19, 1, 0.22, 1); height: 0px;\">\u003cdiv>\u003cdiv class=\"\">\u003cp class=\"Text Text_p Text_Text_3__y2SRf FAQ_Dropdown__text__gPhwg\">We're one of the few user experience agencies focusing on enterprise UX design and the digital transformation of legacy business software. Our years of experience have allowed us to refine our process, enabling us to revitalize B2B software for top-tier Fortune 100 companies like ADP, Amazon, VMware, and Cisco.\u003cbr>\u003cbr>Through our ultra-collaborative process and design thinking approach, we create consumer-grade user experiences for business users. We prioritize scalability and longevity by empowering our clients' in-house teams with robust design systems. This ensures continuity and adaptability, enabling the organization to evolve and grow seamlessly.\u003cbr>\u003cbr>We usually function as an independent unit within the organizational structure. Operating like a startup, we inject agility and fresh perspectives into the sometimes bureaucratic enterprise environment. This approach helps us navigate complex hierarchies and decision-making processes swiftly and efficiently, delivering innovative solutions.\u003c/p>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003c/main>\u003cfooter class=\"Footer_Footer__jAFa5 Footer_Footer_white__4PNoe Layout_Displaced__aKdPG\">\u003cdiv class=\"Container_Container__FVHN5 Footer_Container__zBpzr\">\u003cdiv class=\"Footer_StageWrapper__K862v\">\u003cdiv class=\"Stage_Stage__Bs_Gc Footer_Stage__X1yP5\" data-theme=\"white\">\u003ccanvas data-engine=\"three.js r147\" width=\"1344\" height=\"1008\" style=\"width: 896px; height: 672px; position: absolute; left: 0px; top: 0px;\">\u003c/canvas>\u003c/div>\u003c/div>\u003cdiv class=\"Footer_ContactsContainer__VCles\">\u003cdiv class=\"Footer_TitleWrapper__uuTfH\">\u003ch2 class=\"Heading_Heading_level_1__ol8hg Heading_Heading_animation--fade__r3Hno Heading_Heading_triggered__r_NhZ Footer_Title__9izok\">Let’s Talk\u003c/h2>\u003ca href=\"mailto:hey@clay.global\" target=\"_blank\" rel=\"noreferrer noopener\" class=\"LinkSanity_Link__pMW_u LinkSanity_Link_underline__hVo5A LinkSanity_large__X4Klv Footer_ContactsEmailLink__LbmA6 Footer_VisibleText2__GOvaU\" aria-label=\"Email\">\u003cspan class=\"Text Text_span Text_Text_1__3j52p LinkSanity_Text__hRdee\">\u003cspan class=\"LinkSanity_Label__y3E5E\">hey@clay.global\u003c/span>\u003c/span>\u003c/a>\u003ca href=\"tel:+1 415 796 6262\" target=\"_blank\" rel=\"noreferrer noopener\" class=\"LinkSanity_Link__pMW_u LinkSanity_large__X4Klv Footer_ContactsTelLink__ZTfDu Footer_VisibleText2__GOvaU\" aria-label=\"Tel\">\u003cspan class=\"Text Text_span LinkSanity_Text__hRdee\">\u003cspan class=\"LinkSanity_Label__y3E5E\">+1 415 796 6262\
