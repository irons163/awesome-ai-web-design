# Include this file from your Nginx http context.
# Replace the reserved example hostname before enabling it.
map $arg_download $webdesign_disposition {
    default "";
    "1" "attachment";
}

server {
    listen 80;
    server_name your-domain.example;
    root /var/www/awesome-ai-web-design/current/www;
    index index.html;
    charset utf-8;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    autoindex off;
    add_header Content-Disposition $webdesign_disposition;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location ~* \.md$ {
        types { text/plain md; }
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition $webdesign_disposition;
    }

    location ~* \.(avif|gif|ico|jpe?g|png|svg|webp|woff2?|ttf|otf|mp4|webm)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header Content-Disposition $webdesign_disposition;
    }
}
