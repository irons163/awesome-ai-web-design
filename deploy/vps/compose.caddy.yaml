name: awesome-ai-web-design

services:
  awesome-ai-web-design:
    image: caddy:2.10
    container_name: awesome-ai-web-design
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - /var/www/awesome-ai-web-design:/srv/site:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data:rw,noexec,nosuid,size=16m,uid=1000,gid=1000,mode=700
      - /config:rw,noexec,nosuid,size=16m,uid=1000,gid=1000,mode=700
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-xai-proxy}
