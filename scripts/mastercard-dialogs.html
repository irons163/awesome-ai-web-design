<dialog id="study-cookies" class="study-dialog" aria-labelledby="study-cookies-title">
<h2 id="study-cookies-title">我們如何使用cookies及您的同意</h2>
<p>我們使用cookie和類似技術（‘Cookies’）， 來改善網站、衡量效能、了解受眾並強化使用者體驗。同時，我們會根據您對本網站和其他網站的瀏覽和興趣為您提供廣告。點擊下面的「管理Cookies」，可以了解在此網站上使用哪些 Cookies 以及原因。您隨時可在網站下方的「管理Cookies」更改您的同意偏好（在某些網站上以連結形式提供，而非按鈕），這包括拒絕部分或全部 Cookies，但本網站正常運作不可缺少的Cookies除外。</p>
<div class="cookie-actions"><button type="button" data-cookie="accept">接受cookies</button><button type="button" data-cookie="reject">全部拒絕</button><button type="button" data-cookie="manage">管理cookies</button></div>
</dialog>
<dialog id="study-cookie-settings" class="study-dialog" aria-labelledby="study-cookie-settings-title">
<h2 id="study-cookie-settings-title">管理cookies</h2>
<label><input type="checkbox" checked disabled> 必要 Cookies</label>
<label><input id="study-functional" type="checkbox"> 功能性 Cookies</label>
<button class="dialog-close" type="button" id="study-save-cookies">儲存偏好設定</button>
</dialog>
